# Netlify build config. `npm run build` prerenders each route if Chrome is
# available (set CHROME_BIN), otherwise it builds a clean-URL SPA gracefully.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ⚠️  REMOVE THIS BLOCK AT DOMAIN CUTOVER — IT HIDES THE SITE FROM GOOGLE. ⚠️
#
# The site currently serves from rck-web.netlify.app while www.rckpm.es still
# runs the old Wix site. Every page here emits canonical/OG URLs pointing at
# www.rckpm.es, so letting crawlers index the netlify.app copy would point them
# at a domain serving different content. This header keeps the staging copy out
# of the index until the real domain is attached.
#
# Netlify's [[headers]] are path-scoped, not host-scoped, so this applies to
# EVERY host — including www.rckpm.es once it points here. Delete this block as
# part of the cutover, or the launched site will never be indexed. (For a
# host-aware version that needs no cleanup, an edge function can set the header
# only when the request Host ends in .netlify.app.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
