# Netlify build config. `npm run build` renders every route to static HTML in
# headless Chrome. On Netlify that Chrome comes from netlify-plugin-chromium
# below and the build fails without it; a local build without Chrome still
# falls back to a clean-URL SPA.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions — currently the GitHub OAuth handshake that signs editors
# into /admin. Served at /.netlify/functions/<name>, which bypasses the SPA
# catch-all in public/_redirects.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The build's prerender step (scripts/prerender.mjs) renders every route in
# headless Chrome to write real static HTML. Netlify's build image has no
# Chrome, so this plugin installs one and exports CHROME_PATH, which the script
# picks up. Without it the build fails rather than quietly deploying a JS-only
# site with no per-page HTML.
[[plugins]]
  package = "netlify-plugin-chromium"

# ⚠️  REMOVE THIS BLOCK AT DOMAIN CUTOVER — IT HIDES THE SITE FROM GOOGLE. ⚠️
#
# The site currently serves from rck-web.netlify.app while www.rckpm.es still
# runs the old Wix site. Every page here emits canonical/OG URLs pointing at
# www.rckpm.es, so letting crawlers index the netlify.app copy would point them
# at a domain serving different content. This header keeps the staging copy out
# of the index until the real domain is attached.
#
# Netlify's [[headers]] are path-scoped, not host-scoped, so this applies to
# EVERY host — including www.rckpm.es once it points here. Delete this block as
# part of the cutover, or the launched site will never be indexed. (For a
# host-aware version that needs no cleanup, an edge function can set the header
# only when the request Host ends in .netlify.app.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
