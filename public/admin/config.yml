# Decap CMS configuration.
# Editors log in at /admin, changes are committed to the Git repo, and the site
# rebuilds and deploys automatically.

backend:
  name: git-gateway # Netlify Identity + Git Gateway (set up in Netlify)
  branch: main # the branch the site deploys from

# Lets you preview the CMS locally with: npx decap-server  (then open /admin)
local_backend: true

# Uploaded images (e.g. partner headshots) are committed here.
media_folder: "public/photos/team"
public_folder: "/photos/team"

collections:
  - name: partners
    label: "Partners"
    label_singular: "Partner"
    description: "The people on the /about/team page. Drag to reorder with the 'Display order' number."
    folder: "src/content/partners"
    identifier_field: name
    extension: json
    format: json
    create: true
    slug: "{{fields.order}}-{{slug}}"
    summary: "{{fields.order}}. {{name}} — {{role}}"
    sortable_fields: [order, name]
    fields:
      - { name: order, label: "Display order", widget: number, value_type: int, default: 1 }
      - { name: name, label: "Name", widget: string }
      - { name: role, label: "Role", widget: string, hint: "e.g. Partner · Retail Operations" }
      - { name: photo, label: "Headshot", widget: image, required: false, hint: "Square image looks best; leave empty for a blank placeholder." }
      - { name: bio, label: "Bio", widget: text }

  - name: posts
    label: "Insights posts"
    label_singular: "Post"
    description: "Articles on /insights. The file name becomes the URL: /post/<slug>."
    folder: "src/content/posts"
    identifier_field: title
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{date}} — {{title}}"
    sortable_fields: [date, title]
    media_folder: "/public/blog"
    public_folder: "/blog"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: date, label: "Publish date", widget: date, format: "YYYY-MM-DD" }
      - { name: slug, label: "URL slug", widget: string, hint: "Lives at /post/<slug>. Changing this breaks existing links — leave it alone on migrated posts." }
      - { name: description, label: "Summary", widget: text, hint: "Shown on /insights and used as the search/social description." }
      - { name: author, label: "Author", widget: string, default: "Shaun Taylor" }
      - { name: hero, label: "Hero image", widget: image, required: false }
      - { name: source, label: "Original URL", widget: string, required: false, hint: "Where the post was migrated from. Leave blank for new posts." }
      - { name: body, label: "Body", widget: markdown }
